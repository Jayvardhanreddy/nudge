<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Nudge</title><link rel="stylesheet" href="styles.css"></head>
<body class="app-body">
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <section class="auth-card" style="width:min(440px,100%)">
    <div style="text-align:center;margin-bottom:24px"><h1>Reset password</h1><p style="color:var(--ink-secondary)">Choose a new password for your account.</p></div>
    <form id="resetForm">
      <input id="password" class="form-input" type="password" minlength="6" maxlength="128" autocomplete="new-password" placeholder="New password" required>
      <input id="confirm" class="form-input" type="password" minlength="6" maxlength="128" autocomplete="new-password" placeholder="Confirm password" required style="margin-top:12px">
      <button class="btn btn-accent btn-block" style="margin-top:16px">Reset password</button>
      <p id="message" style="margin-top:14px;color:var(--ink-secondary)"></p>
    </form>
  </section>
</main>
<script>
const form=document.getElementById('resetForm'), msg=document.getElementById('message');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const token=new URLSearchParams(location.search).get('token')||'';
 const password=document.getElementById('password').value, confirm=document.getElementById('confirm').value;
 if(!token||password.length<6||password!==confirm){msg.textContent='Enter a valid matching password.';return;}
 try{
  const r=await fetch('/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token,password})});
  const d=await r.json().catch(()=>({}));
  msg.textContent=d.message||d.error||'Unable to reset password.';
  if(r.ok)setTimeout(()=>location.replace('login.html?tab=login'),1200);
 }catch{msg.textContent='Unable to reset password. Please try again.';}
});
</script>
</body></html>
